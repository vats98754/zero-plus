[package]
name = "zero-plus"
version = "0.1.0"
edition = "2021"
description = "0+ HFT strategy for penny stocks and L2 crypto markets"
license = "MIT"

[lib]
name = "zero_plus"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
async-nats = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
futures = "0.3"
tungstenite = "0.20"
tokio-tungstenite = "0.20"
url = "2.4"
rust_decimal = { version = "1.30", features = ["serde-float"] }
dashmap = "5.5"
reqwest = { version = "0.11", features = ["json", "stream"] }
moka = { version = "0.12", features = ["future"] }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "zero-plus"
path = "src/main.rs"